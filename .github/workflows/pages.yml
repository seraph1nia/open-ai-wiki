name: Deploy knowledge site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Install repository toolchain
        run: mise install
      - name: Restore pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Format, lint and type check
        run: pnpm exec vp check
      - name: Check Astro formatting
        run: pnpm exec vp run fmt:astro:check
      - name: Lint Astro components
        run: pnpm exec vp run lint:astro
      - name: Validate OpenWiki bundle
        run: pnpm exec vp run lint:wiki
      - name: Type check Astro app
        run: pnpm exec vp run -r typecheck
      - name: Test
        run: pnpm exec vp test
      - name: Build
        run: pnpm exec vp run -r build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
