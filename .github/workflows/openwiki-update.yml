name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # Times are UTC; the offsets below are Europe/Amsterdam during CEST
    # (one hour later locally in winter). Minute 7 keeps us off the top of
    # the hour, where GitHub's scheduler is most backed up.
    - cron: "7 6 * * 6" # Saturday ~08:07 Amsterdam
    - cron: "7 1 * * 4" # Wednesday night / Thursday ~03:07 Amsterdam

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Ingestion and up to three repair passes are all model calls, so a hung
    # provider request would otherwise sit on a runner until GitHub's six-hour
    # default. A clean scheduled run measured 55 minutes, nearly all of it
    # ingestion, so leave room for a slower one plus three repair passes.
    timeout-minutes: 120
    # OPENROUTER_API_KEY and TAVILY_API_KEY are environment secrets on `prd`,
    # so the job has to claim that environment or they resolve to empty strings.
    environment: prd
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install repository toolchain
        run: mise install

      - name: Restore pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - name: Ingest external knowledge
        run: pnpm wiki:ingest -- --scheduled
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENWIKI_PROVIDER: openrouter
          OPENWIKI_MODEL_ID: deepseek/deepseek-v4-flash-0731
          OPENWIKI_TELEMETRY_DISABLED: "1"

      # Deterministic validation decides whether the ingested corpus is
      # publishable. On failure the exact findings go back to OpenWiki as a
      # bounded repair request; if the corpus is still invalid after the last
      # attempt, the run fails here rather than opening a broken pull request.
      - name: Validate and repair the OpenWiki bundle
        run: pnpm wiki:validate-repair
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENWIKI_PROVIDER: openrouter
          OPENWIKI_MODEL_ID: deepseek/deepseek-v4-flash-0731
          OPENWIKI_TELEMETRY_DISABLED: "1"

      # Records the run's diff as an immutable changelog fragment for the site's
      # /whats-new feed, and reuses the same summary as this PR's description.
      - name: Record what changed
        id: changelog
        run: |
          pnpm wiki:changelog -- --markdown "$RUNNER_TEMP/changelog.md"
          {
            echo 'body<<OPENWIKI_CHANGELOG_EOF'
            cat "$RUNNER_TEMP/changelog.md"
            echo 'OPENWIKI_CHANGELOG_EOF'
          } >>"$GITHUB_OUTPUT"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: deepseek/deepseek-v4-flash-0731

      # Generates apps/web/.astro/types.d.ts, which is gitignored but required
      # for `astro:content` and `import.meta.env` to type check.
      - name: Generate Astro types
        run: pnpm --filter @ai-knowledge/web exec astro sync

      # The same sequence the pull request would face, run before it exists, so
      # a broken update never reaches review. A failure here fails the update:
      # application, test and build failures are not OpenWiki's to repair and
      # are never handed to the repair loop.
      - name: Run full CI
        run: pnpm exec vp run ci

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            openwiki
            changelog
          branch: openwiki/update
          delete-branch: true
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki knowledge update.

            ${{ steps.changelog.outputs.body }}

            This PR was generated by the scheduled OpenWiki workflow.
